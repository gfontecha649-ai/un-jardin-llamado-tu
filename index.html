
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Un pequeño jardín creado con cariño para Sandra.">

    <title>Un jardín llamado tú | Sandra</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>

        <!-- PORTADA PRINCIPAL -->
        <section class="hero" id="inicio">

            <div class="stars"></div>

            <div class="hero-content">

                <p class="eyebrow">
                    UNA PEQUEÑA SORPRESA PARA TI
                </p>

                <h1>
                    Un jardín
                    <span>llamado tú</span>
                </h1>

                <p class="hero-subtitle">
                    Entre orquídeas, mariposas y atardeceres,
                    hay personas que merecen ser celebradas.
                </p>

                <div class="flower-decoration">
                    ✿
                </div>

                <h2>
                    Hola, Sandra...
                </h2>

                <p class="intro-message">
                    Hoy hay un pequeño jardín que floreció
                    pensando en ti.
                </p>

                <button id="enterGarden" class="main-button">
                    Descubrir mi sorpresa
                    <span>🦋</span>
                </button>

                <p class="small-note">
                    He preparado algo especial para ti.
                </p>

            </div>

            <div class="scroll-indicator">
                <span>Un pequeño viaje comienza aquí</span>
                <span>↓</span>
            </div>

        </section>


        <!-- AQUÍ CONSTRUIREMOS EL MENSAJE -->
        <section id="mensaje" class="content-section">
        </section>


        <!-- AQUÍ FLORECERÁ VIOLETA -->
        <section id="violeta" class="content-section">
        </section>


        <!-- AQUÍ GUARDAREMOS LOS RECUERDOS -->
        <section id="recuerdos" class="content-section">
        </section>


        <!-- AQUÍ ESTARÁ LA CANCIÓN -->
        <section id="cancion" class="content-section">
        </section>


        <!-- AQUÍ ESTARÁ LA INVITACIÓN -->
        <section id="invitacion" class="content-section">
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
